<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Subtraction Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f4f8; color: #102a43; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #fff; width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    h1 { font-size: 1.4rem; color: #2b6cb0; margin-bottom: 6px; }
    .subtitle { font-size: 0.85rem; color: #627d98; margin-bottom: 15px; }
    
    .btn { background: #2b6cb0; color: #fff; border: none; padding: 12px 20px; font-size: 1.1rem; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn:active { transform: scale(0.98); background: #2c5282; }
    .btn-secondary { background: #4a5568; }

    .timer-container { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
    .timer-bar { height: 100%; width: 100%; background: #3182ce; }

    .question-box { font-size: 3.5rem; font-weight: 800; margin: 5px 0; color: #102a43; }
    .feedback { font-size: 1.6rem; font-weight: bold; min-height: 38px; }
    .feedback.correct { color: #38a169; }
    .feedback.incorrect { color: #e53e3e; }
    .feedback.skipped { color: #d69e2e; }

    .transcript-box { font-size: 0.9rem; color: #2b6cb0; background: #ebf8ff; padding: 10px; border-radius: 8px; margin: 10px 0; font-weight: 600; border: 1px solid #bee3f8; min-height: 42px; display: flex; align-items: center; justify-content: center; }

    .hud { display: flex; justify-content: space-between; background: #f7fafc; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; border: 1px solid #edf2f7; }
    
    /* Quick Tap Fallback Buttons */
    .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
    .key-btn { background: #edf2f7; border: 1px solid #cbd5e0; border-radius: 6px; padding: 8px 0; font-size: 1.1rem; font-weight: bold; color: #2d3748; cursor: pointer; }
    .key-btn:active { background: #cbd5e0; }

    .hide { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Math Voice Practice</h1>
    <p class="subtitle">Single-Digit Subtraction Game</p>

    <!-- Start View -->
    <div id="start-view">
      <p style="font-size: 0.9rem; color: #4a5568; margin-bottom: 15px;">
        Tap <strong>Start Quiz</strong>. Speak your answer or tap a digit button below if voice latency occurs.
      </p>
      <button class="btn" id="start-btn">Start Quiz</button>
    </div>

    <!-- Active Quiz View -->
    <div id="quiz-view" class="hide">
      <div class="hud">
        <span>Total: <strong id="hud-total">0</strong></span>
        <span>Correct: <strong id="hud-correct" style="color:#38a169;">0</strong></span>
      </div>

      <div class="timer-container"><div id="timer-bar" class="timer-bar"></div></div>
      <div id="question" class="question-box">?-?</div>
      <div id="feedback" class="feedback"></div>

      <div id="heard-text" class="transcript-box">Listening continuously...</div>

      <!-- Keypad Backup for Mobile Speed -->
      <div class="keypad">
        <button class="key-btn" onclick="handleInput(0)">0</button>
        <button class="key-btn" onclick="handleInput(1)">1</button>
        <button class="key-btn" onclick="handleInput(2)">2</button>
        <button class="key-btn" onclick="handleInput(3)">3</button>
        <button class="key-btn" onclick="handleInput(4)">4</button>
        <button class="key-btn" onclick="handleInput(5)">5</button>
        <button class="key-btn" onclick="handleInput(6)">6</button>
        <button class="key-btn" onclick="handleInput(7)">7</button>
        <button class="key-btn" onclick="handleInput(8)">8</button>
        <button class="key-btn" onclick="handleInput(9)">9</button>
      </div>

      <button class="btn btn-secondary" id="finish-btn" style="margin-top: 15px;">Stop & View Results</button>
    </div>

    <!-- Results View -->
    <div id="results-view" class="hide">
      <h2>Session Summary</h2>
      <div style="margin: 20px 0; text-align: left; line-height: 2;">
        <p>Total Questions: <strong id="res-total">0</strong></p>
        <p style="color: #38a169;">Correct Answers: <strong id="res-correct">0</strong></p>
        <p style="color: #e53e3e;">Incorrect Answers: <strong id="res-incorrect">0</strong></p>
        <p style="color: #d69e2e;">Unanswered/Skipped: <strong id="res-skipped">0</strong></p>
      </div>
      <button class="btn" id="restart-btn">Try Again</button>
    </div>
  </div>

  <script>
    const NUMBER_MAP = {
      'zero': 0, 'oh': 0, 'zip': 0,
      'one': 1, 'won': 1,
      'two': 2, 'to': 2, 'too': 2,
      'three': 3, 'tree': 3, 'free': 3,
      'four': 4, 'for': 4, 'fore': 4,
      'five': 5, 'hive': 5,
      'six': 6, 'sex': 6,
      'seven': 7,
      'eight': 8, 'ate': 8,
      'nine': 9
    };

    let currentAns = null;
    let answered = false;
    let timerInterval = null;
    let startTime = 0;
    const DURATION = 3000;

    let stats = { total: 0, correct: 0, incorrect: 0, skipped: 0 };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let quizActive = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      // Silent background restart without triggering Android beep loop
      recognition.onend = () => {
        if (quizActive) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = (event) => {
        if (answered || !quizActive) return;

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript.toLowerCase().trim();
          document.getElementById('heard-text').textContent = `Heard: "${text}"`;

          const digit = parseDigit(text);
          if (digit !== null) {
            handleInput(digit);
            break;
          }
        }
      };
    }

    function parseDigit(str) {
      const words = str.split(/\s+/);
      for (let w of words) {
        if (!isNaN(parseInt(w)) && parseInt(w) >= 0 && parseInt(w) <= 9) return parseInt(w);
        if (NUMBER_MAP.hasOwnProperty(w)) return NUMBER_MAP[w];
      }
      return null;
    }

    function nextQuestion() {
      if (!answered && currentAns !== null) {
        stats.skipped++;
        document.getElementById('feedback').textContent = 'Skipped';
        document.getElementById('feedback').className = 'feedback skipped';
      }

      answered = false;
      document.getElementById('heard-text').textContent = 'Listening...';

      const num1 = Math.floor(Math.random() * 10);
      const num2 = Math.floor(Math.random() * (num1 + 1));
      currentAns = num1 - num2;

      stats.total++;
      document.getElementById('hud-total').textContent = stats.total;
      document.getElementById('question').textContent = `${num1} - ${num2} = ?`;

      startTime = Date.now();
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, DURATION - elapsed);
        const pct = (remaining / DURATION) * 100;
        document.getElementById('timer-bar').style.width = pct + '%';

        if (remaining <= 0) {
          clearInterval(timerInterval);
          nextQuestion();
        }
      }, 50);
    }

    function handleInput(val) {
      if (answered) return;
      answered = true;

      if (val === currentAns) {
        stats.correct++;
        document.getElementById('hud-correct').textContent = stats.correct;
        document.getElementById('feedback').textContent = '✓ Correct';
        document.getElementById('feedback').className = 'feedback correct';
      } else {
        stats.incorrect++;
        document.getElementById('feedback').textContent = `✗ Wrong (${val})`;
        document.getElementById('feedback').className = 'feedback incorrect';
      }
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      stats = { total: 0, correct: 0, incorrect: 0, skipped: 0 };
      currentAns = null;
      quizActive = true;

      document.getElementById('hud-total').textContent = "0";
      document.getElementById('hud-correct').textContent = "0";

      document.getElementById('start-view').classList.add('hide');
      document.getElementById('quiz-view').classList.remove('hide');

      if (recognition) {
        try { recognition.start(); } catch(e){}
      }

      nextQuestion();
    });

    document.getElementById('finish-btn').addEventListener('click', () => {
      quizActive = false;
      clearInterval(timerInterval);

      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }

      if (!answered && currentAns !== null) {
        stats.skipped++;
      }

      document.getElementById('res-total').textContent = stats.total;
      document.getElementById('res-correct').textContent = stats.correct;
      document.getElementById('res-incorrect').textContent = stats.incorrect;
      document.getElementById('res-skipped').textContent = stats.skipped;

      document.getElementById('quiz-view').classList.add('hide');
      document.getElementById('results-view').classList.remove('hide');
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      document.getElementById('results-view').classList.add('hide');
      document.getElementById('start-view').classList.remove('hide');
    });
  </script>
</body>
</html>
