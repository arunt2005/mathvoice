<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Subtraction Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f4f8; color: #102a43; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    h1 { font-size: 1.4rem; color: #2b6cb0; margin-bottom: 8px; }
    .subtitle { font-size: 0.85rem; color: #627d98; margin-bottom: 20px; }
    
    .btn { background: #2b6cb0; color: #fff; border: none; padding: 14px 24px; font-size: 1rem; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #4a5568; }

    .setting-group { margin: 15px 0; text-align: left; font-size: 0.9rem; color: #4a5568; }
    .setting-group select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 1rem; }

    .timer-container { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
    .timer-bar { height: 100%; width: 100%; background: #3182ce; transition: width 0.05s linear; }

    .question-box { font-size: 3.5rem; font-weight: 800; margin: 10px 0; color: #102a43; }
    .feedback { font-size: 1.8rem; font-weight: bold; min-height: 40px; }
    .feedback.correct { color: #38a169; }
    .feedback.incorrect { color: #e53e3e; }
    .feedback.skipped { color: #d69e2e; }

    .transcript-box { font-size: 0.9rem; color: #2b6cb0; background: #ebf8ff; padding: 10px; border-radius: 8px; margin-top: 15px; font-weight: 600; border: 1px solid #bee3f8; }
    .status-indicator { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.8rem; color: #38a169; margin-top: 10px; }
    .dot { width: 8px; height: 8px; background: #38a169; border-radius: 50%; animation: blink 1s infinite; }
    
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .hud { display: flex; justify-content: space-between; background: #f7fafc; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; border: 1px solid #edf2f7; }
    .hide { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Math Voice Practice</h1>
    <p class="subtitle">Single-Digit Subtraction Game</p>

    <!-- Setup View -->
    <div id="start-view">
      <div class="setting-group">
        <label for="timer-select">Question Duration:</label>
        <select id="timer-select">
          <option value="3000" selected>3 Seconds (Fast)</option>
          <option value="4000">4 Seconds (Recommended for Mobile)</option>
          <option value="5000">5 Seconds (Relaxed)</option>
        </select>
      </div>
      <button class="btn" id="start-btn">Start Practice</button>
    </div>

    <!-- Active Quiz View -->
    <div id="quiz-view" class="hide">
      <div class="hud">
        <span>Total: <strong id="hud-total">0</strong></span>
        <span>Correct: <strong id="hud-correct" style="color:#38a169;">0</strong></span>
      </div>

      <div class="timer-container"><div id="timer-bar" class="timer-bar"></div></div>
      <div id="question" class="question-box">?-?</div>
      <div id="feedback" class="feedback"></div>

      <div id="heard-text" class="transcript-box">Listening for voice...</div>
      
      <div class="status-indicator">
        <div class="dot"></div>
        <span id="mic-status">Mic Active</span>
      </div>

      <button class="btn btn-secondary" id="finish-btn" style="margin-top: 20px;">Stop & View Results</button>
    </div>

    <!-- Results View -->
    <div id="results-view" class="hide">
      <h2>Session Summary</h2>
      <div style="margin: 20px 0; text-align: left; line-height: 2;">
        <p>Total Questions: <strong id="res-total">0</strong></p>
        <p style="color: #38a169;">Correct Answers: <strong id="res-correct">0</strong></p>
        <p style="color: #e53e3e;">Incorrect Answers: <strong id="res-incorrect">0</strong></p>
        <p style="color: #d69e2e;">Unanswered/Skipped: <strong id="res-skipped">0</strong></p>
      </div>
      <button class="btn" id="restart-btn">Try Again</button>
    </div>
  </div>

  <script>
    // Homophone map for numbers 0-9
    const NUMBER_MAP = {
      'zero': 0, 'oh': 0, 'zip': 0,
      'one': 1, 'won': 1,
      'two': 2, 'to': 2, 'too': 2,
      'three': 3, 'tree': 3, 'free': 3,
      'four': 4, 'for': 4, 'fore': 4,
      'five': 5, 'hive': 5,
      'six': 6, 'sex': 6,
      'seven': 7,
      'eight': 8, 'ate': 8,
      'nine': 9
    };

    let currentAns = null;
    let answered = false;
    let timerInterval = null;
    let startTime = 0;
    let duration = 3000;

    let stats = { total: 0, correct: 0, incorrect: 0, skipped: 0 };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let shouldListen = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        document.getElementById('mic-status').textContent = "Mic Active";
      };

      recognition.onend = () => {
        // Force restart microphone session on mobile disconnects
        if (shouldListen) {
          try { recognition.start(); } catch(e) {}
        }
      };

      recognition.onresult = (event) => {
        if (answered) return;

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript.toLowerCase().trim();
          document.getElementById('heard-text').textContent = `Heard: "${text}"`;

          const digit = parseDigit(text);
          if (digit !== null) {
            checkAnswer(digit);
            break;
          }
        }
      };
    } else {
      alert("Web Speech API is not supported on this browser. Please use Chrome on Android.");
    }

    function parseDigit(str) {
      const words = str.split(/\s+/);
      for (let w of words) {
        if (!isNaN(parseInt(w)) && parseInt(w) >= 0 && parseInt(w) <= 9) return parseInt(w);
        if (NUMBER_MAP.hasOwnProperty(w)) return NUMBER_MAP[w];
      }
      return null;
    }

    function nextQuestion() {
      if (!answered && currentAns !== null) {
        stats.skipped++;
        document.getElementById('feedback').textContent = 'Skipped';
        document.getElementById('feedback').className = 'feedback skipped';
      }

      answered = false;
      document.getElementById('heard-text').textContent = 'Listening...';

      // Ensure subtraction result remains non-negative (0 to 9)
      const num1 = Math.floor(Math.random() * 10);
      const num2 = Math.floor(Math.random() * (num1 + 1));
      currentAns = num1 - num2;

      stats.total++;
      document.getElementById('hud-total').textContent = stats.total;
      document.getElementById('question').textContent = `${num1} - ${num2} = ?`;

      startTime = Date.now();
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, duration - elapsed);
        const pct = (remaining / duration) * 100;
        document.getElementById('timer-bar').style.width = pct + '%';

        if (remaining <= 0) {
          clearInterval(timerInterval);
          nextQuestion();
        }
      }, 50);
    }

    function checkAnswer(val) {
      answered = true;
      if (val === currentAns) {
        stats.correct++;
        document.getElementById('hud-correct').textContent = stats.correct;
        document.getElementById('feedback').textContent = '✓ Correct';
        document.getElementById('feedback').className = 'feedback correct';
      } else {
        stats.incorrect++;
        document.getElementById('feedback').textContent = `✗ Wrong (${val})`;
        document.getElementById('feedback').className = 'feedback incorrect';
      }
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      duration = parseInt(document.getElementById('timer-select').value);
      stats = { total: 0, correct: 0, incorrect: 0, skipped: 0 };
      currentAns = null;
      
      document.getElementById('hud-total').textContent = "0";
      document.getElementById('hud-correct').textContent = "0";

      document.getElementById('start-view').classList.add('hide');
      document.getElementById('quiz-view').classList.remove('hide');

      shouldListen = true;
      if (recognition) {
        try { recognition.start(); } catch(e) {}
      }

      nextQuestion();
    });

    document.getElementById('finish-btn').addEventListener('click', () => {
      shouldListen = false;
      clearInterval(timerInterval);

      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      if (!answered && currentAns !== null) {
        stats.skipped++;
      }

      document.getElementById('res-total').textContent = stats.total;
      document.getElementById('res-correct').textContent = stats.correct;
      document.getElementById('res-incorrect').textContent = stats.incorrect;
      document.getElementById('res-skipped').textContent = stats.skipped;

      document.getElementById('quiz-view').classList.add('hide');
      document.getElementById('results-view').classList.remove('hide');
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      document.getElementById('results-view').classList.add('hide');
      document.getElementById('start-view').classList.remove('hide');
    });
  </script>
</body>
</html>
