<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Subtraction Practice (Mobile Optimized)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      color: #102a43;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #334e68;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #627d98;
      margin-bottom: 20px;
    }

    /* Start / Control Screen */
    .btn {
      background-color: #2b6cb0;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(43, 108, 176, 0.3);
      transition: background 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: #2c5282;
    }

    .btn-secondary {
      background-color: #4a5568;
      box-shadow: none;
    }

    /* Timer Bar */
    .timer-container {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: #3182ce;
      transition: width 0.05s linear;
    }

    /* Question Display */
    .question-box {
      font-size: 3.5rem;
      font-weight: 800;
      color: #102a43;
      margin: 15px 0;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Feedback Overlay */
    .feedback {
      font-size: 2rem;
      font-weight: bold;
      min-height: 40px;
      margin-bottom: 10px;
    }

    .feedback.correct { color: #38a169; }
    .feedback.incorrect { color: #e53e3e; }
    .feedback.skipped { color: #d69e2e; }

    /* Live Voice Indicator */
    .voice-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #48bb78;
      font-weight: 600;
      margin-top: 10px;
      min-height: 24px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: #48bb78;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.5; }
    }

    .transcript-box {
      font-size: 0.9rem;
      color: #718096;
      margin-top: 8px;
      min-height: 20px;
      font-style: italic;
    }

    /* Stats HUD */
    .hud {
      display: flex;
      justify-content: space-between;
      background: #f7fafc;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #4a5568;
      margin-bottom: 15px;
      border: 1px solid #edf2f7;
    }

    /* Modal / Results */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: white;
      border-radius: 20px;
      padding: 24px;
      flex-direction: column;
      justify-content: center;
      z-index: 10;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }

    .result-card {
      background: #f7fafc;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    .result-card .num {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .hide { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Math Voice Practice</h1>
    <p class="subtitle">3 Seconds per Question • Single Digit Subtraction</p>

    <!-- Start View -->
    <div id="start-view">
      <p style="font-size: 0.95rem; color: #4a5568; margin-bottom: 20px;">
        Tap the button below and speak your answer clearly during each 3-second timer.
      </p>
      <button class="btn" id="start-btn">Start Quiz</button>
    </div>

    <!-- Active Quiz View -->
    <div id="quiz-view" class="hide">
      <div class="hud">
        <span>Questions: <strong id="hud-total">0</strong></span>
        <span>Correct: <strong id="hud-correct" style="color:#38a169;">0</strong></span>
      </div>

      <div class="timer-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>

      <div id="question" class="question-box">?-?</div>

      <div id="feedback" class="feedback"></div>

      <div class="voice-status">
        <div class="dot"></div>
        <span id="mic-text">Microphone Active</span>
      </div>

      <div id="heard-text" class="transcript-box">Heard: -</div>

      <button class="btn btn-secondary" id="finish-btn" style="margin-top: 25px;">Stop & Show Results</button>
    </div>

    <!-- Results Modal -->
    <div id="results-modal" class="modal">
      <h2>Session Complete</h2>
      <div class="results-grid">
        <div class="result-card">
          <div>Total Asked</div>
          <div id="res-total" class="num">0</div>
        </div>
        <div class="result-card">
          <div>Correct</div>
          <div id="res-correct" class="num" style="color: #38a169;">0</div>
        </div>
        <div class="result-card">
          <div>Incorrect</div>
          <div id="res-incorrect" class="num" style="color: #e53e3e;">0</div>
        </div>
        <div class="result-card">
          <div>Unanswered</div>
          <div id="res-unanswered" class="num" style="color: #d69e2e;">0</div>
        </div>
      </div>

      <button class="btn" id="restart-btn">Try Again</button>
    </div>
  </div>

  <script>
    // Numbers & homophones mapping for Speech-to-Text quirks
    const NUMBER_MAP = {
      'zero': 0, 'oh': 0, 'zip': 0, 'nil': 0,
      'one': 1, 'won': 1, '1st': 1,
      'two': 2, 'to': 2, 'too': 2,
      'three': 3, 'tree': 3, 'free': 3,
      'four': 4, 'for': 4, 'fore': 4, 'door': 4,
      'five': 5, 'hive': 5,
      'six': 6, 'sex': 6, 'sticks': 6,
      'seven': 7,
      'eight': 8, 'ate': 8,
      'nine': 9, 'nein': 9
    };

    // State
    let currentAns = null;
    let answeredThisRound = false;
    let timerInterval = null;
    let startTime = 0;
    const DURATION = 3000; // 3 seconds per question

    let stats = {
      total: 0,
      correct: 0,
      incorrect: 0,
      unanswered: 0
    };

    // DOM Elements
    const startView = document.getElementById('start-view');
    const quizView = document.getElementById('quiz-view');
    const resultsModal = document.getElementById('results-modal');
    
    const startBtn = document.getElementById('start-btn');
    const finishBtn = document.getElementById('finish-btn');
    const restartBtn = document.getElementById('restart-btn');

    const questionEl = document.getElementById('question');
    const feedbackEl = document.getElementById('feedback');
    const heardTextEl = document.getElementById('heard-text');
    const timerBar = document.getElementById('timer-bar');

    const hudTotal = document.getElementById('hud-total');
    const hudCorrect = document.getElementById('hud-correct');

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (!SpeechRecognition) {
      alert("Speech Recognition is not supported by your browser. Please try Google Chrome on Android.");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => { isListening = true; };
      recognition.onend = () => { 
        isListening = false;
        // Keep mic alive on mobile continuously
        if (!quizView.classList.contains('hide')) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onresult = (event) => {
        if (answeredThisRound) return; // Ignore multiple spoken inputs in 1 question window

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.toLowerCase().trim();
          heardTextEl.textContent = `Heard: "${transcript}"`;

          const parsedNumber = extractDigit(transcript);
          if (parsedNumber !== null) {
            validateAnswer(parsedNumber);
            break;
          }
        }
      };
    }

    // Helper: Parse spoken text to single digit number
    function extractDigit(str) {
      // Direct numeric check
      const words = str.split(/\s+/);
      for (let word of words) {
        if (!isNaN(parseInt(word)) && parseInt(word) >= 0 && parseInt(word) <= 9) {
          return parseInt(word);
        }
        if (NUMBER_MAP.hasOwnProperty(word)) {
          return NUMBER_MAP[word];
        }
      }
      return null;
    }

    // Safe mic handle
    function ensureMicActive() {
      if (recognition && !isListening) {
        try { recognition.start(); } catch(e){}
      }
    }

    // Game Logic
    function nextQuestion() {
      // Evaluate if previous question was missed
      if (!answeredThisRound && currentAns !== null) {
        stats.unanswered++;
        feedbackEl.textContent = "Skipped";
        feedbackEl.className = "feedback skipped";
      }

      ensureMicActive();

      // Reset question state
      answeredThisRound = false;
      heardTextEl.textContent = "Heard: -";

      // Generate Single-Digit Subtraction (Ensure Non-negative result)
      const num1 = Math.floor(Math.random() * 10);
      const num2 = Math.floor(Math.random() * (num1 + 1));
      currentAns = num1 - num2;

      stats.total++;
      hudTotal.textContent = stats.total;
      questionEl.textContent = `${num1} - ${num2} = ?`;

      // Start 3s Timer Animation
      startTime = Date.now();
      clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, DURATION - elapsed);
        const pct = (remaining / DURATION) * 100;
        timerBar.style.width = pct + "%";

        if (remaining <= 0) {
          clearInterval(timerInterval);
          nextQuestion();
        }
      }, 50);
    }

    function validateAnswer(userVal) {
      answeredThisRound = true;

      if (userVal === currentAns) {
        stats.correct++;
        hudCorrect.textContent = stats.correct;
        feedbackEl.textContent = "✓ Correct";
        feedbackEl.className = "feedback correct";
      } else {
        stats.incorrect++;
        feedbackEl.textContent = `✗ Wrong (${userVal})`;
        feedbackEl.className = "feedback incorrect";
      }
    }

    function startQuiz() {
      stats = { total: 0, correct: 0, incorrect: 0, unanswered: 0 };
      currentAns = null;
      hudTotal.textContent = "0";
      hudCorrect.textContent = "0";

      startView.classList.add('hide');
      resultsModal.style.display = 'none';
      quizView.classList.remove('hide');

      ensureMicActive();
      nextQuestion();
    }

    function stopQuiz() {
      clearInterval(timerInterval);
      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }

      // Check final state
      if (!answeredThisRound && currentAns !== null) {
        stats.unanswered++;
      }

      // Render Modal
      document.getElementById('res-total').textContent = stats.total;
      document.getElementById('res-correct').textContent = stats.correct;
      document.getElementById('res-incorrect').textContent = stats.incorrect;
      document.getElementById('res-unanswered').textContent = stats.unanswered;

      quizView.classList.add('hide');
      resultsModal.style.display = 'flex';
    }

    // Listeners
    startBtn.addEventListener('click', startQuiz);
    finishBtn.addEventListener('click', stopQuiz);
    restartBtn.addEventListener('click', startQuiz);
  </script>
</body>
</html>
